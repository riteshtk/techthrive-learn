name: Report a bug
description: Something on the site doesn't work or reads wrongly.
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Page
      description: The link where it happens, including ?step= if relevant.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 7, Chrome 142
  - type: dropdown
    id: setup
    attributes:
      label: Anything special about your setup?
      multiple: true
      options:
        - Keyboard only
        - Screen reader
        - Reduced motion
        - Light mode
        - JavaScript off
