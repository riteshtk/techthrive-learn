name: Suggest a topic
description: Propose a system to teach, built around one real production design.
title: "Add a topic: "
labels: ["new topic"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic
      placeholder: e.g. Event streaming at scale
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: The one system it's built around
      placeholder: e.g. An order-events platform
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - AI & ML
        - Payments & fintech
        - Distributed systems
        - Data
        - Security
        - Reliability
        - Cloud & platform
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Foundation
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: textarea
    id: lessons
    attributes:
      label: Lessons
      description: A rough list of lessons, and the moving parts each one adds to the system.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Papers, official docs or engineering posts to check the figures against.
  - type: checkboxes
    id: write
    attributes:
      label: Writing it
      options:
        - label: I'd like to write this topic myself (see CONTRIBUTING.md).
