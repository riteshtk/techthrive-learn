name: Update visual baselines

# Run by hand after a deliberate visual change. It renders every screen on
# the same Linux runner CI compares on and uploads the PNGs; review them,
# then commit them from the artifact (gh run download). Baselines are never
# made on a Mac: fonts and anti-aliasing differ.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: Render baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/screens.spec.ts-snapshots/
          retention-days: 14
